# Single-decision eval cases (decision 0003). Run: uv run arcee-cli eval
#
# Held out: never copy these into prompts, usage cards or the example library,
# or the suite stops measuring anything. Tool results use the real tools' data
# shapes. Paths are written with ~; the eval home is /home/user.
#
# expect.any_of: dotted tool names, "reply" (final answer) or "ask" (question).
# args_contain / args_lack / reply_has / reply_lacks: case-insensitive substrings.

# --- look-first: nothing observed yet; pick the tool that gets the fact ---------

[[case]]
id = "look-list-downloads"
scenario = "look-first"
request = "What's in my Downloads folder?"
expect = { any_of = ["fs.list"], args_contain = { path = "Downloads" } }

[[case]]
id = "look-free-disk"
scenario = "look-first"
request = "Am I running low on disk space?"
expect = { any_of = ["shell.run", "system.status"], args_contain = { cmd = "df" } }

[[case]]
id = "look-folder-size"
scenario = "look-first"
request = "How much space is my Videos folder taking up?"
expect = { any_of = ["shell.run", "fs.list"], args_contain = { cmd = ["du", "videos"], path = "videos" } }

[[case]]
id = "look-ip"
scenario = "look-first"
request = "Tell me this computer's local IP address."
expect = { any_of = ["shell.run", "network.status"], args_contain = { cmd = "ip" }, args_lack = { cmd = "ipconfig" } }

[[case]]
id = "look-find-unknown-location"
scenario = "look-first"
request = "Where did I save my passport scan?"
expect = { any_of = ["fs.search"], args_contain = { query = "passport" } }

[[case]]
id = "look-read-known-file"
scenario = "look-first"
request = "What does ~/todo.md say?"
expect = { any_of = ["fs.read"], args_contain = { path = "todo.md" } }

[[case]]
id = "look-running-program"
scenario = "look-first"
request = "Is Firefox running right now?"
expect = { any_of = ["shell.run"], args_contain = { cmd = "firefox" } }

[[case]]
id = "look-memory"
scenario = "look-first"
request = "How much RAM is free?"
expect = { any_of = ["shell.run", "system.status"], args_contain = { cmd = "free" } }

[[case]]
id = "look-before-delete"
scenario = "look-first"
request = "Clean up the zip files in ~/Desktop."
expect = { any_of = ["fs.list", "fs.search"] }

[[case]]
id = "look-kernel"
scenario = "look-first"
request = "Which Linux kernel version am I on?"
expect = { any_of = ["shell.run", "system.status"], args_contain = { cmd = "uname" } }

# --- use-result: the answer is already in a tool result -------------------------

[[case]]
id = "use-count-from-glob"
scenario = "use-result"
request = "How many spreadsheets do I have in ~/Work?"
history = [
  { call = "fs.list", args = { path = "~/Work", glob = "*.xlsx" }, data = { path = "~/Work", sort = "name", count = 4, entries = [
    { name = "budget.xlsx", type = "file", size = "14.2 KB", modified = "2026-09-01 10:00" },
    { name = "q3.xlsx", type = "file", size = "8.0 KB", modified = "2026-10-02 09:12" },
    { name = "q4.xlsx", type = "file", size = "8.1 KB", modified = "2026-10-20 16:40" },
    { name = "team.xlsx", type = "file", size = "3.3 KB", modified = "2026-06-11 11:05" },
  ] } },
]
expect = { any_of = ["reply"], reply_has = ["4"] }

