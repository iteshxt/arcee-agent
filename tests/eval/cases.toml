[[case]]
id = "use-search-result-path"
scenario = "use-result"
request = "Where is my resume?"
history = [
  { call = "fs.search", args = { query = "resume" }, data = { query = "resume", root = "~", by = "name", count = 1, matches = ["~/Documents/jobs/resume-2026.pdf"] } },
]
expect = { any_of = ["reply"], reply_has = ["resume-2026.pdf"] }

[[case]]
id = "use-folder-size-from-du"
scenario = "use-result"
request = "How big is my Music folder?"
history = [
  { call = "shell.run", args = { cmd = "du -sh ~/Music" }, data = { exit_code = 0, stdout = "17G\t/home/user/Music\n", stderr = "" } },
]
expect = { any_of = ["reply"], reply_has = ["17"] }

[[case]]
id = "use-empty-listing"
scenario = "use-result"
request = "Do I have any screenshots in ~/Pictures/Screenshots?"
history = [
  { call = "fs.list", args = { path = "~/Pictures/Screenshots" }, data = { path = "~/Pictures/Screenshots", sort = "name", count = 0, entries = [] } },
]
expect = { any_of = ["reply"], reply_has = ["no"] }

[[case]]
id = "use-process-check"
scenario = "use-result"
request = "Is Spotify running?"
history = [
  { call = "shell.run", args = { cmd = "pgrep -a spotify" }, data = { exit_code = 1, stdout = "", stderr = "", note = "no output and exit code 1: nothing matched" } },
]
expect = { any_of = ["reply"], reply_has = ["not"] }

[[case]]
id = "use-read-then-read-other"
scenario = "use-result"
request = "Read ~/a.txt and ~/b.txt and tell me which one mentions the deadline."
history = [
  { call = "fs.read", args = { path = "~/a.txt" }, data = { path = "~/a.txt", content = "Groceries: eggs, rice, coffee." } },
