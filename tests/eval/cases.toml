[[case]]
id = "use-newest-from-sorted"
scenario = "use-result"
request = "Which file did I download most recently?"
history = [
  { call = "fs.list", args = { path = "~/Downloads", sort = "newest", limit = 2 }, data = { path = "~/Downloads", sort = "newest", count = 57, shown = 2, entries = [
