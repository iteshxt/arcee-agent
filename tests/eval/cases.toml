    { name = "beach.jpg", type = "file", size = "2.1 MB", modified = "2026-08-01 10:00" },
    { name = "clip.mp4", type = "file", size = "40.0 MB", modified = "2026-08-01 10:05" },
    { name = "dinner.jpg", type = "file", size = "1.8 MB", modified = "2026-08-01 20:00" },
    { name = "map.png", type = "file", size = "300.0 KB", modified = "2026-08-02 09:00" },
    { name = "notes.txt", type = "file", size = "1.0 KB", modified = "2026-08-02 09:30" },
    { name = "sunset.jpg", type = "file", size = "2.4 MB", modified = "2026-08-02 19:10" },
  ] } },
