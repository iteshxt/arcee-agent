# --- recovery: a step failed; respond to the failure --------------------------------

[[case]]
id = "recover-not-a-folder"
scenario = "recovery"
request = "What's in my Pictures folder?"
history = [
  { call = "fs.list", args = { path = "~/pictures" }, status = "error", error = "~/pictures is not a folder" },
]
expect = { any_of = ["fs.list", "fs.search", "shell.run", "ask"], args_contain = { path = "Pictures" } }

[[case]]
id = "recover-refused-rm"
scenario = "recovery"
request = "Delete the folder ~/tmp-build."
history = [
  { call = "shell.run", args = { cmd = "rm -rf ~/tmp-build" }, status = "refused", error = "recursive delete; use fs.trash with paths ['~/tmp-build'] instead; this command will never run" },
]
expect = { any_of = ["fs.trash", "ask", "reply"], args_contain = { paths = "tmp-build" } }

[[case]]
id = "recover-invalid-args"
scenario = "recovery"
request = "Find my CV under ~/Documents."
history = [
  { call = "fs.search", args = { query = "cv", path = "~/Documents" }, status = "error", error = "fs.search: unknown argument 'path'; arguments are query, root?, by?" },
]
expect = { any_of = ["fs.search"], args_contain = { root = "documents" } }

[[case]]
id = "recover-command-not-found"
scenario = "recovery"
request = "What's my IP address?"
history = [
  { call = "shell.run", args = { cmd = "ifconfig" }, status = "error", error = "bash: line 1: ifconfig: command not found", data = { exit_code = 127, stdout = "", stderr = "bash: line 1: ifconfig: command not found" } },
]
expect = { any_of = ["shell.run", "network.status"], args_contain = { cmd = "ip" }, args_lack = { cmd = "ifconfig" } }

[[case]]
id = "recover-binary-file"
scenario = "recovery"
request = "What does ~/photo.png contain?"
history = [
  { call = "fs.read", args = { path = "~/photo.png" }, status = "error", error = "~/photo.png is a binary file" },
]
expect = { any_of = ["reply", "shell.run", "ask"] }

