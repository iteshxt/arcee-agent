id = "use-disk-from-df"
scenario = "use-result"
request = "How much free space is left on my main drive?"
history = [
  { call = "shell.run", args = { cmd = "df -h /" }, data = { exit_code = 0, stdout = "Filesystem      Size  Used Avail Use% Mounted on\n/dev/nvme0n1p2  468G  401G   44G  91% /\n", stderr = "" } },
