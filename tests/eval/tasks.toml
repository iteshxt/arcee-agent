# --- documents, jobs, later ---------------------------------------------------------

[[task]]
id = "make-a-pdf"
category = "files"
request = "Make a PDF at ~/Documents/plan.pdf that says 'Q4 plan: ship Arcee'"
files = { "Documents/" = "" }
check = { used = ["doc.create"], exists = ["Documents/plan.pdf"] }

[[task]]
