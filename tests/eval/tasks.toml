stub = { "shell.start" = { summary = "Started job1-1 in the background: `make test`", data = { job = "job1-1", cmd = "make test" } } }
check = { used = ["shell.start"], args = { "shell.start" = { cmd = "make test" } } }

[[task]]
id = "check-back-later"
