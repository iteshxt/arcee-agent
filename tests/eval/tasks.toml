request = "Will it rain in Delhi tomorrow?"
stub = { "web.weather" = { summary = "Delhi: haze, 24°C", data = { place = "Delhi, India", days = [ { day = "today", high = 27, low = 15, rain_chance = 5 }, { day = "tomorrow", high = 25, low = 16, rain_chance = 70, sky = "showers" } ] } } }
