[[task]]
id = "trains-morning"
category = "travel"
request = "Find trains from Ludhiana to Delhi tomorrow morning."
stub = { "travel.search" = { summary = "3 trains from Ludhiana Jn (LDH) to New Delhi (NDLS)", data = { trains = [ { train = "22462 Shri Shakti Exp", departs = "05:30", arrives = "09:50" }, { train = "12014 Amritsar Shtabdi", departs = "07:02", arrives = "11:02" }, { train = "12716 Sachkhand Exp", departs = "07:45", arrives = "12:45" } ] } } }
check = { used = ["travel.search"], not_used = ["web.search"], reply_has = ["12014"] }

