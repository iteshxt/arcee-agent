request = "Check again in 5 minutes whether ~/Downloads/report.pdf has arrived"
files = { "Downloads/" = "" }
check = { used = ["control.set_timer"], args = { "control.set_timer" = { minutes = "5" } }, not_used = ["reminder.add"] }

[[task]]
id = "what-did-i-ask-yesterday"
category = "memory"
request = "What did I ask you yesterday?"
check = { used = ["memory.history"], not_used = ["web.search"] }
